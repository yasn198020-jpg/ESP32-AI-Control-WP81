name: WP8.1 build - MSBuild 12 clean

on:
  workflow_dispatch:
  push:
    branches:
      - wp81-msbuild12-clean-test

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Visual Studio 2015 Community
        shell: powershell
        timeout-minutes: 30
        run: |
          choco install visualstudio2015community -y --no-progress --ignore-checksums
          choco install visualstudio2015-update3 -y --no-progress --ignore-checksums

      - name: Install Windows Phone 8.1 SDK
        shell: powershell
        timeout-minutes: 45
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'windowsphone81sdkupdate1.iso'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/E/7/D/E7D9744A-06A6-46FB-AEA4-50FAAEC6CE73/windowsphone81sdkupdate1.iso' -OutFile $iso
          $image = Mount-DiskImage -ImagePath $iso -PassThru
          try {
            $volume = $image | Get-Volume | Where-Object DriveLetter | Select-Object -First 1
            if (-not $volume) { throw 'Cannot determine mounted SDK drive.' }
            $root = "$($volume.DriveLetter):\"
            $msis = Get-ChildItem $root -Recurse -Filter '*.msi' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^WindowsPhoneSdk-(ARM|Desktop|Desktop-x64|x86)\.msi$' }
            if (-not $msis) { throw 'WP8.1 SDK MSI packages not found.' }
            foreach ($msi in $msis) {
              Write-Host "Installing $($msi.Name)"
              $p = Start-Process msiexec.exe -ArgumentList '/i',$msi.FullName,'/qn','/norestart' -Wait -PassThru
              if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "SDK MSI failed: $($msi.Name), exit $($p.ExitCode)" }
            }
          } finally {
            Dismount-DiskImage -ImagePath $iso -ErrorAction SilentlyContinue
          }

      - name: Verify legacy toolchain
        shell: powershell
        run: |
          $candidates = @(
            'C:\Program Files (x86)\MSBuild\12.0\Bin\MSBuild.exe',
            'C:\Program Files (x86)\Microsoft Visual Studio 12.0\MSBuild\Bin\MSBuild.exe'
          )
          $msbuild = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild 14.0 was not installed.' }
          $sdk = 'C:\Program Files (x86)\Windows Phone Kits\8.1'
          if (-not (Test-Path $sdk)) { throw "Windows Phone 8.1 SDK not found: $sdk" }
          & $msbuild -version
          Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio 12.0\MSBuild' -Recurse -Filter '*Xaml*.targets' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          "MSBUILD14=$msbuild" | Out-File $env:GITHUB_ENV -Append
          "WINDOWS_PHONE_SDK_DIR=$sdk" | Out-File $env:GITHUB_ENV -Append

      - name: Build Release ARM
        shell: powershell
        run: |
          & "$env:MSBUILD14" '.\ESP32-AI-Control-WP81.sln' /t:Build /p:Configuration=Release /p:Platform=ARM /verbosity:normal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WP81-MSBuild12-Release-ARM
          path: |
            src/ESP32AIControl.WP81/bin/Release/**
            src/ESP32AIControl.WP81/obj/Release/**
          if-no-files-found: warn
