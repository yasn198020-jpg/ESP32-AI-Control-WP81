name: WP8.1 build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: wp81-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Windows 10 SDK 10240
        shell: powershell
        timeout-minutes: 20
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup10240.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/E/1/F/E1F1E61E-F3C6-4420-A916-FB7C47FBC89E/standalonesdk/sdksetup.exe' -OutFile $installer
          $p = Start-Process -FilePath $installer -ArgumentList '/features','+','/q','/norestart','/ceip','off' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windows 10 SDK 10240 installation failed: $($p.ExitCode)" }
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $contract = Get-ChildItem $kitsRoot -Recurse -Filter 'Windows.Foundation.UniversalApiContract.winmd' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\1\.0\.0\.0\\Windows\.Foundation\.UniversalApiContract\.winmd$' } |
            Select-Object -First 1
          if (-not $contract) {
            Write-Host 'Available UniversalApiContract files:'
            Get-ChildItem $kitsRoot -Recurse -Filter 'Windows.Foundation.UniversalApiContract.winmd' -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw 'Windows 10 SDK 10240 UniversalApiContract.winmd with version directory 1.0.0.0 was not found.'
          }
          Write-Host "SDK 10240 Universal contract: $($contract.FullName)"
          "SDK10240_UNIVERSAL=$($contract.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Prepare Windows metadata for legacy XAML compiler
        shell: powershell
        run: |
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits"
          $legacyRoot = Join-Path $kitsRoot "8.1"
          $legacyMetadata = Join-Path $legacyRoot "References\CommonConfiguration\Neutral"
          New-Item -ItemType Directory -Force -Path $legacyMetadata | Out-Null

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $unionRoot = Join-Path $sdkRoot 'UnionMetadata'
          $facadeWinmd = Join-Path $unionRoot 'Facade\Windows.winmd'
          if (Test-Path $facadeWinmd) {
            $winmd = Get-Item $facadeWinmd
          } else {
            $winmd = Get-ChildItem $unionRoot -Recurse -Filter 'Windows.winmd' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '10\.0\.10240' } | Select-Object -First 1
            if (-not $winmd) {
              $rootWinmd = Join-Path $unionRoot 'Windows.winmd'
              if (Test-Path $rootWinmd) { $winmd = Get-Item $rootWinmd }
            }
          }
          if (-not $winmd) {
            $winmd = Get-ChildItem $kitsRoot -Recurse -Filter 'Windows.winmd' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\References\\CommonConfiguration\\Neutral\\Windows.winmd$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $winmd) { throw "Windows.winmd was not found." }
          Copy-Item $winmd.FullName (Join-Path $legacyMetadata "Windows.winmd") -Force

          if ($env:SDK10240_UNIVERSAL -and (Test-Path $env:SDK10240_UNIVERSAL)) {
            $universal = Get-Item $env:SDK10240_UNIVERSAL
          } else {
            $preferredUniversal = Join-Path $kitsRoot "10\References\10.0.10240.0\Windows.Foundation.UniversalApiContract\1.0.0.0\Windows.Foundation.UniversalApiContract.winmd"
            if (Test-Path $preferredUniversal) {
              $universal = Get-Item $preferredUniversal
            } else {
              $legacyMicrosoftSdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft SDKs'
              $universal = Get-ChildItem $legacyMicrosoftSdkRoot -Recurse -Filter "Windows.Foundation.UniversalApiContract.winmd" -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $universal) {
                $universal = Get-ChildItem $kitsRoot -Recurse -Filter "Windows.Foundation.UniversalApiContract.winmd" -File -ErrorAction SilentlyContinue | Select-Object -First 1
              }
            }
            if (-not $universal) {
              $universal = Get-ChildItem $kitsRoot -Recurse -Filter "Windows.Foundation.UniversalApiContract.winmd" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          if (-not $universal) { throw "Windows.Foundation.UniversalApiContract.winmd was not found." }

          $universalDir = Join-Path $legacyRoot "References\Windows.Foundation.UniversalApiContract"
          New-Item -ItemType Directory -Force -Path $universalDir | Out-Null
          Copy-Item $universal.FullName (Join-Path $universalDir "Windows.Foundation.UniversalApiContract.winmd") -Force
          Copy-Item $universal.FullName (Join-Path $legacyMetadata "Windows.Foundation.UniversalApiContract.winmd") -Force

          Write-Host "Windows SDK metadata root: $legacyRoot"
          Write-Host "Windows.winmd: $(Join-Path $legacyMetadata 'Windows.winmd')"
          Write-Host "Universal contract: $(Join-Path $universalDir 'Windows.Foundation.UniversalApiContract.winmd')"

      - name: Install Windows Phone 8.1 SDK components
        shell: powershell
        timeout-minutes: 45
        run: |
          $iso = Join-Path $env:RUNNER_TEMP "windowsphone81sdkupdate1.iso"
          $url = "https://download.microsoft.com/download/E/7/D/E7D9744A-06A6-46FB-AEA4-50FAAEC6CE73/windowsphone81sdkupdate1.iso"
          Start-BitsTransfer -Source $url -Destination $iso -DisplayName "Windows Phone 8.1 SDK ISO" -Description "Microsoft Windows Phone 8.1 Update 1" -Priority High
          $image = Mount-DiskImage -ImagePath $iso -PassThru
          try {
            $volume = $image | Get-Volume | Where-Object DriveLetter | Select-Object -First 1
            if (-not $volume) { throw "Could not determine mounted SDK drive." }
            $root = "$($volume.DriveLetter):\"
            $msis = Get-ChildItem $root -Recurse -Filter *.msi -File -ErrorAction SilentlyContinue
            $selected = foreach ($msi in $msis) {
              if ($msi.Name -ieq 'WindowsPhoneSdk-ARM.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-Desktop.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-Desktop-x64.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-x86.msi') { $msi }
            }
            if (-not $selected) { throw "Windows Phone SDK MSI packages were not found." }
            foreach ($msi in $selected) {
              $p = Start-Process msiexec.exe -ArgumentList '/i',$msi.FullName,'/qn','/norestart' -Wait -PassThru
              if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "SDK MSI failed: $($msi.Name), code $($p.ExitCode)" }
            }
            $isoUniversal = Get-ChildItem $root -Recurse -Filter 'Windows.Foundation.UniversalApiContract.winmd' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($isoUniversal) {
              $kitsUniversalDir = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1\References\Windows.Foundation.UniversalApiContract'
              New-Item -ItemType Directory -Force -Path $kitsUniversalDir | Out-Null
              Copy-Item $isoUniversal.FullName (Join-Path $kitsUniversalDir 'Windows.Foundation.UniversalApiContract.winmd') -Force
              $kitsNeutral = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1\References\CommonConfiguration\Neutral'
              Copy-Item $isoUniversal.FullName (Join-Path $kitsNeutral 'Windows.Foundation.UniversalApiContract.winmd') -Force
              Write-Host "Using Universal API contract from WP8.1 SDK media: $($isoUniversal.FullName)"
            } else { Write-Host 'WP8.1 SDK media did not contain UniversalApiContract.winmd; retaining NuGet fallback.' }
          } finally {
            Dismount-DiskImage -ImagePath $iso -ErrorAction SilentlyContinue
          }

      - name: Configure Windows Phone SDK path
        shell: powershell
        run: |
          $legacyPhoneRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Phone Kits\8.1'
          if (-not (Test-Path (Join-Path $legacyPhoneRoot 'References'))) { throw "WP8.1 SDK root not found: $legacyPhoneRoot" }

          $legacyReferences = Join-Path $legacyPhoneRoot 'References\CommonConfiguration\Neutral'
          New-Item -ItemType Directory -Force -Path $legacyReferences | Out-Null
          Copy-Item (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1\References\CommonConfiguration\Neutral\Windows.winmd') (Join-Path $legacyReferences 'Windows.winmd') -Force
          $facadeWinmd = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\UnionMetadata\Facade\Windows.winmd'
          if (Test-Path $facadeWinmd) { Copy-Item $facadeWinmd (Join-Path $legacyReferences 'Windows.winmd') -Force }
          $phoneUniversalDir = Join-Path $legacyPhoneRoot 'References\Windows.Foundation.UniversalApiContract'
          New-Item -ItemType Directory -Force -Path $phoneUniversalDir | Out-Null
          $universalSource = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1\References\Windows.Foundation.UniversalApiContract\Windows.Foundation.UniversalApiContract.winmd'
          if (-not (Test-Path $universalSource)) { throw "Universal contract source not found: $universalSource" }
          Copy-Item $universalSource (Join-Path $phoneUniversalDir 'Windows.Foundation.UniversalApiContract.winmd') -Force
          $phoneUniversalVersionDir = Join-Path $legacyPhoneRoot 'References\Windows.Foundation.UniversalApiContract\1.0.0.0'
          New-Item -ItemType Directory -Force -Path $phoneUniversalVersionDir | Out-Null
          Copy-Item $universalSource (Join-Path $phoneUniversalVersionDir 'Windows.Foundation.UniversalApiContract.winmd') -Force
          Copy-Item $universalSource (Join-Path $legacyReferences 'Windows.Foundation.UniversalApiContract.winmd') -Force

          $foundationSource = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\References\Windows.Foundation.FoundationContract\1.0.0.0\Windows.Foundation.FoundationContract.winmd'
          if (-not (Test-Path $foundationSource)) { throw "FoundationContract source not found: $foundationSource" }
          $phoneFoundationDir = Join-Path $legacyPhoneRoot 'References\Windows.Foundation.FoundationContract\1.0.0.0'
          New-Item -ItemType Directory -Force -Path $phoneFoundationDir | Out-Null
          Copy-Item $foundationSource (Join-Path $phoneFoundationDir 'Windows.Foundation.FoundationContract.winmd') -Force
          $foundationRootDir = Join-Path $legacyPhoneRoot 'References\Windows.Foundation.FoundationContract'
          New-Item -ItemType Directory -Force -Path $foundationRootDir | Out-Null
          Copy-Item $foundationSource (Join-Path $foundationRootDir 'Windows.Foundation.FoundationContract.winmd') -Force
          Copy-Item $foundationSource (Join-Path $legacyReferences 'Windows.Foundation.FoundationContract.winmd') -Force

          $registryPaths = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\WindowsPhone\v8.1',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\WindowsPhoneApp\v8.1'
          )
          foreach ($key in $registryPaths) {
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name 'Install Path' -PropertyType String -Value ($legacyPhoneRoot + '\') -Force | Out-Null
            New-ItemProperty -Path $key -Name 'InstallationFolder' -PropertyType String -Value ($legacyPhoneRoot + '\') -Force | Out-Null
          }

          "WINDOWS_PHONE_SDK_DIR=$legacyPhoneRoot" | Out-File $env:GITHUB_ENV -Append
          "TARGET_PLATFORM_SDK_ROOT_OVERRIDE=$legacyPhoneRoot" | Out-File $env:GITHUB_ENV -Append
          "WINDOWS_SDK_ROOT=$(Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1')" | Out-File $env:GITHUB_ENV -Append

      - name: Locate legacy XAML targets
        shell: powershell
        run: |
          $target = "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WindowsXaml\v17.0\8.1\Microsoft.Windows.UI.Xaml.CSharp.Targets"
          if (-not (Test-Path $target)) { throw "WP8.1 XAML target not found: $target" }
          "XAML_TARGET_PATH=$target" | Out-File $env:GITHUB_ENV -Append
      - name: Locate WP XAML build tools
        shell: powershell
        run: |
          $msbuild = "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) { throw "MSBuild not found: $msbuild" }
          if (-not (Test-Path $env:XAML_TARGET_PATH)) { throw "WP8.1 XAML target not found: $env:XAML_TARGET_PATH" }
          "MSBUILD_PATH=$msbuild" | Out-File $env:GITHUB_ENV -Append
      - name: Install .NET Framework 4.5 reference assemblies
        shell: powershell
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
          $net45 = Join-Path $env:RUNNER_TEMP "nuget-net45"
          New-Item -ItemType Directory -Force -Path $net45 | Out-Null
          & $nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory $net45 -NonInteractive
          $frameworkRoot = Join-Path $net45 "Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3\build\.NETFramework\v4.5"
          if (-not (Test-Path (Join-Path $frameworkRoot "mscorlib.dll"))) { throw "NET Framework 4.5 reference assemblies not found." }
          if (-not (Test-Path (Join-Path $frameworkRoot "System.dll"))) { throw "NET Framework 4.5 System.dll reference assembly not found." }

          # The legacy WP8.1 XAML compiler expects the .NET 4.5 facade
          # assemblies to be directly visible from the reference directory.
          # The runner's .NET 4.5 package keeps them under Facades, so flatten
          # that exact .NET 4.5 facade set into FRAMEWORK_PATH.
          $facadesRoot = Join-Path $frameworkRoot "Facades"
          if (-not (Test-Path $facadesRoot)) { throw "NET Framework 4.5 Facades directory was not found: $facadesRoot" }
          $facades = Get-ChildItem $facadesRoot -Filter "*.dll" -File -ErrorAction SilentlyContinue
          if (-not $facades) { throw "NET Framework 4.5 facade assemblies were not found." }
          foreach ($facade in $facades) {
            Copy-Item $facade.FullName $frameworkRoot -Force
          }

          $winrtRoot = Join-Path $env:RUNNER_TEMP "winrt-packages"
          New-Item -ItemType Directory -Force -Path $winrtRoot | Out-Null
          & $nuget install System.Runtime.WindowsRuntime -Version 4.6.0 -OutputDirectory $winrtRoot -NonInteractive
          & $nuget install System.Runtime.WindowsRuntime.UI.Xaml -Version 4.6.0 -OutputDirectory $winrtRoot -NonInteractive
          $winrtPackage = Join-Path $winrtRoot "System.Runtime.WindowsRuntime.4.6.0"
          $winrtUiPackage = Join-Path $winrtRoot "System.Runtime.WindowsRuntime.UI.Xaml.4.6.0"
          $winrtDll = Get-ChildItem $winrtPackage -Recurse -Filter "System.Runtime.WindowsRuntime.dll" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $winrtUiDll = Get-ChildItem $winrtUiPackage -Recurse -Filter "System.Runtime.WindowsRuntime.UI.Xaml.dll" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $winrtDll -or -not $winrtUiDll) { throw "Windows Runtime interop assemblies were not found in NuGet packages." }
          Copy-Item $winrtDll.FullName $frameworkRoot -Force
          Copy-Item $winrtUiDll.FullName $frameworkRoot -Force
          "FRAMEWORK_PATH=$frameworkRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Build solution
        shell: powershell
        run: |
          & "$env:MSBUILD_PATH" ".\ESP32-AI-Control-WP81.sln" /m /t:Build /p:Configuration=Debug /p:Platform="ARM" /p:FrameworkPathOverride="$env:FRAMEWORK_PATH" /p:TargetFrameworkRootPath="$env:FRAMEWORK_PATH" /p:TargetFrameworkVersion="v4.5" /p:WindowsPhoneSdkDir="$env:WINDOWS_PHONE_SDK_DIR" /p:WindowsPhoneSDKDir="$env:WINDOWS_PHONE_SDK_DIR" /p:WindowsPhoneSdkRoot="$env:WINDOWS_PHONE_SDK_DIR" /p:WindowsPhoneSDKRoot="$env:WINDOWS_PHONE_SDK_DIR" /p:TargetPlatformSdkRootOverride="$env:TARGET_PLATFORM_SDK_ROOT_OVERRIDE" /p:TargetPlatformSdkRoot="$env:TARGET_PLATFORM_SDK_ROOT_OVERRIDE" /p:WindowsSdkDir="$env:WINDOWS_SDK_ROOT" /p:WindowsPhoneSdkVersion="8.1" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WP81-build-output
          path: |
            src/ESP32AIControl.WP81/bin/**
            src/ESP32AIControl.WP81/obj/**
          if-no-files-found: warn
