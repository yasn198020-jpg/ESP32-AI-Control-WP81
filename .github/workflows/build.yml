name: WP8.1 build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: wp81-build-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows 8.1 SDK
        shell: powershell
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP "winsdk81-bootstrap.exe"
          $layout = Join-Path $env:RUNNER_TEMP "winsdk81-layout"
          $log = Join-Path $env:RUNNER_TEMP "winsdk81-install.log"

          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=323507" -OutFile $bootstrap
          Write-Host "Downloaded Windows 8.1 SDK bootstrapper: $bootstrap"
          Write-Host "Bootstrapper size: $((Get-Item $bootstrap).Length) bytes"
          Write-Host "Bootstrapper version: $((Get-Item $bootstrap).VersionInfo.FileVersion)"

          New-Item -ItemType Directory -Force -Path $layout | Out-Null
          Write-Host "Creating offline SDK layout: $layout"
          $layoutProc = Start-Process -FilePath $bootstrap -ArgumentList "/layout",$layout -PassThru
          $deadline = (Get-Date).AddMinutes(20)
          while (-not $layoutProc.HasExited) {
            Start-Sleep -Seconds 30
            $layoutProc.Refresh()
            $files = @(Get-ChildItem $layout -Recurse -File -ErrorAction SilentlyContinue)
            $count = $files.Count
            $bytes = ($files | Measure-Object Length -Sum).Sum
            if ($null -eq $bytes) { $bytes = 0 }
            Write-Host ("SDK layout progress: {0} files, {1:N0} bytes" -f $count,$bytes)
            if ((Get-Date) -gt $deadline) {
              try { Stop-Process -Id $layoutProc.Id -Force -ErrorAction SilentlyContinue } catch {}
              throw "Windows 8.1 SDK layout creation exceeded 20 minutes and was stopped."
            }
          }
          $layoutProc.Refresh()
          $layoutCode = $layoutProc.ExitCode
          Write-Host "SDK layout exit code: $layoutCode"
          if (($layoutCode -ne 0) -and ($layoutCode -ne 3010)) {
            throw "Windows 8.1 SDK layout creation failed with exit code $layoutCode"
          }

          Write-Host "SDK layout contents:"
          Get-ChildItem $layout -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table -AutoSize

          $setup = Get-ChildItem $layout -Recurse -Filter "sdksetup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            $setup = Get-ChildItem $layout -Recurse -Filter "setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $setup) {
            throw "Windows 8.1 SDK layout was downloaded, but no setup executable was found."
          }

          Write-Host "Running SDK installer from layout: $($setup.FullName)"
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList "/features","+","/quiet","/norestart","/log",$log -Wait -PassThru
          $code = $proc.ExitCode
          Write-Host "Windows 8.1 SDK installer exit code: $code"
          if (($code -ne 0) -and ($code -ne 3010)) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Windows 8.1 SDK installation failed with exit code $code"
          }

          $winmd = "$env:ProgramFiles(x86)\\Windows Kits\\8.1\\References\\CommonConfiguration\\Neutral\\Windows.winmd"
          if (-not (Test-Path $winmd)) {
            Write-Host "Windows Kits directories:"
            Get-ChildItem "$env:ProgramFiles(x86)\\Windows Kits" -Directory -ErrorAction SilentlyContinue | Select-Object FullName
            Write-Host "Windows.winmd files found:"
            Get-ChildItem "$env:ProgramFiles(x86)\\Windows Kits" -Recurse -Filter Windows.winmd -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            Write-Host "SDK installer log tail:"
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Windows 8.1 SDK Windows.winmd was not found after installation."
          }
          Write-Host "Using Windows 8.1 SDK metadata: $winmd"

      - name: Locate WP XAML build tools
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles(x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles(x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          )

          $selected = $null
          foreach ($msbuild in $candidates) {
            if (-not (Test-Path $msbuild)) { continue }
            $msbuildRoot = Split-Path (Split-Path (Split-Path $msbuild -Parent) -Parent) -Parent
            $targets = @(
              (Join-Path $msbuildRoot "Microsoft\WindowsXaml\v17.0\8.1\Microsoft.Windows.UI.Xaml.CSharp.Targets"),
              (Join-Path $msbuildRoot "Microsoft\WindowsXaml\v16.0\8.1\Microsoft.Windows.UI.Xaml.CSharp.Targets"),
              (Join-Path $msbuildRoot "Microsoft\VisualStudio\v17.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets"),
              (Join-Path $msbuildRoot "Microsoft\VisualStudio\v16.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets")
            )
            foreach ($target in $targets) {
              if (Test-Path $target) {
                $selected = $msbuild
                Write-Host "Selected MSBuild: $msbuild"
                Write-Host "Selected XAML targets: $target"
                break
              }
            }
            if ($selected) { break }
          }

          if (-not $selected) {
            throw "No installed MSBuild with WP8.1 Windows XAML targets was found."
          }

          "MSBUILD_PATH=$selected" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $selected -version

      - name: Install .NET Framework 4.0 reference assemblies
        shell: powershell
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
          $packages = Join-Path $env:RUNNER_TEMP "nuget-packages"
          New-Item -ItemType Directory -Force -Path $packages | Out-Null

          & $nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory $packages -NonInteractive

          $frameworkRoot = Join-Path $packages "Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework\v4.0"
          if (-not (Test-Path (Join-Path $frameworkRoot "mscorlib.dll"))) {
            Write-Host "Installed reference assemblies:"
            Get-ChildItem $packages -Recurse -Filter mscorlib.dll | Select-Object -ExpandProperty FullName
            throw "NET Framework 4.0 reference assemblies were not installed at the expected location."
          }

          Write-Host "Using .NET Framework 4.0 reference assemblies: $frameworkRoot"
          "FRAMEWORK_PATH=$frameworkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Locate solution
        shell: powershell
        run: |
          if (-not (Test-Path ".\ESP32-AI-Control-WP81.sln")) {
            throw "Solution ESP32-AI-Control-WP81.sln not found."
          }
          Get-ChildItem -Recurse -Filter *.csproj | Select-Object FullName

      - name: Build solution
        shell: powershell
        run: |
          & "$env:MSBUILD_PATH" ".\ESP32-AI-Control-WP81.sln" /m /t:Build /p:Configuration=Debug /p:Platform="ARM" /p:FrameworkPathOverride="$env:FRAMEWORK_PATH" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WP81-build-output
          path: |
            src/ESP32AIControl.WP81/bin/**
            src/ESP32AIControl.WP81/obj/**
          if-no-files-found: warn
