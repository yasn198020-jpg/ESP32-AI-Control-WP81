name: WP8.1 build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: wp81-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows 10 SDK 14393 contract metadata
        shell: powershell
        timeout-minutes: 20
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup14393.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=838916' -OutFile $installer
          $p = Start-Process -FilePath $installer -ArgumentList '/quiet','/norestart','/features','+' -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Windows 10 SDK 14393 setup failed: $($p.ExitCode)" }
          $contract = 'C:\Program Files (x86)\Windows Kits\10\References\10.0.14393.0\Windows.Foundation.UniversalApiContract\1.0.0.0\Windows.Foundation.UniversalApiContract.winmd'
          if (-not (Test-Path $contract)) { throw "Windows 10 SDK 14393 UniversalApiContract was not installed." }
          Write-Host "Windows 10 SDK 14393 contract: $contract"

      - name: Prepare Windows metadata for legacy XAML compiler
        shell: powershell
        run: |
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits"
          $legacyRoot = Join-Path $kitsRoot "8.1"
          $legacyMetadata = Join-Path $legacyRoot "References\CommonConfiguration\Neutral"
          New-Item -ItemType Directory -Force -Path $legacyMetadata | Out-Null

          $winmd = Get-ChildItem $kitsRoot -Recurse -Filter "Windows.winmd" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\References\\CommonConfiguration\\Neutral\\Windows.winmd$" } |
            Sort-Object FullName -Descending | Select-Object -First 1

          $metadataRoot = Join-Path $env:RUNNER_TEMP "windows-sdk-metadata"
          if (-not $winmd -or -not (Test-Path (Join-Path $legacyMetadata "Windows.Foundation.UniversalApiContract.winmd"))) {
            $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
            if (-not (Test-Path $nuget)) {
              Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
            }
            New-Item -ItemType Directory -Force -Path $metadataRoot | Out-Null
            & $nuget install Microsoft.Windows.SDK.Contracts -Version 10.0.14393.0 -OutputDirectory $metadataRoot -NonInteractive
          }

          if (-not $winmd) {
            $winmd = Get-ChildItem $metadataRoot -Recurse -Filter "Windows.winmd" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $winmd) { throw "Windows.winmd was not found." }
          Copy-Item $winmd.FullName (Join-Path $legacyMetadata "Windows.winmd") -Force

          $preferredUniversal = Join-Path $kitsRoot "10\References\10.0.14393.0\Windows.Foundation.UniversalApiContract\1.0.0.0\Windows.Foundation.UniversalApiContract.winmd"
          if (Test-Path $preferredUniversal) {
            $universal = Get-Item $preferredUniversal
          } else {
            $legacyMicrosoftSdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft SDKs'
          $universal = Get-ChildItem $legacyMicrosoftSdkRoot -Recurse -Filter "Windows.Foundation.UniversalApiContract.winmd" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $universal) {
            $universal = Get-ChildItem $kitsRoot -Recurse -Filter "Windows.Foundation.UniversalApiContract.winmd" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          }
          if (-not $universal) {
            $universal = Get-ChildItem $metadataRoot -Recurse -Filter "Windows.Foundation.UniversalApiContract.winmd" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $universal) { throw "Windows.Foundation.UniversalApiContract.winmd was not found." }

          $universalDir = Join-Path $legacyRoot "References\Windows.Foundation.UniversalApiContract"
          New-Item -ItemType Directory -Force -Path $universalDir | Out-Null
          Copy-Item $universal.FullName (Join-Path $universalDir "Windows.Foundation.UniversalApiContract.winmd") -Force
          Copy-Item $universal.FullName (Join-Path $legacyMetadata "Windows.Foundation.UniversalApiContract.winmd") -Force

          Write-Host "Windows SDK metadata root: $legacyRoot"
          Write-Host "Windows.winmd: $(Join-Path $legacyMetadata 'Windows.winmd')"
          Write-Host "Universal contract: $(Join-Path $universalDir 'Windows.Foundation.UniversalApiContract.winmd')"

      - name: Install Windows Phone 8.1 SDK components
        shell: powershell
        timeout-minutes: 45
        run: |
          $iso = Join-Path $env:RUNNER_TEMP "windowsphone81sdkupdate1.iso"
          $url = "https://download.microsoft.com/download/E/7/D/E7D9744A-06A6-46FB-AEA4-50FAAEC6CE73/windowsphone81sdkupdate1.iso"
          Start-BitsTransfer -Source $url -Destination $iso -DisplayName "Windows Phone 8.1 SDK ISO" -Description "Microsoft Windows Phone 8.1 Update 1" -Priority High
          $image = Mount-DiskImage -ImagePath $iso -PassThru
          try {
            $volume = $image | Get-Volume | Where-Object DriveLetter | Select-Object -First 1
            if (-not $volume) { throw "Could not determine mounted SDK drive." }
            $root = "$($volume.DriveLetter):\"
            $msis = Get-ChildItem $root -Recurse -Filter *.msi -File -ErrorAction SilentlyContinue
            $selected = foreach ($msi in $msis) {
              if ($msi.Name -ieq 'WindowsPhoneSdk-ARM.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-Desktop.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-Desktop-x64.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-x86.msi') { $msi }
            }
            if (-not $selected) { throw "Windows Phone SDK MSI packages were not found." }
            foreach ($msi in $selected) {
              $p = Start-Process msiexec.exe -ArgumentList '/i',$msi.FullName,'/qn','/norestart' -Wait -PassThru
              if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "SDK MSI failed: $($msi.Name), code $($p.ExitCode)" }
            }
            $isoUniversal = Get-ChildItem $root -Recurse -Filter 'Windows.Foundation.UniversalApiContract.winmd' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($isoUniversal) {
              $kitsUniversalDir = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1\References\Windows.Foundation.UniversalApiContract'
              New-Item -ItemType Directory -Force -Path $kitsUniversalDir | Out-Null
              Copy-Item $isoUniversal.FullName (Join-Path $kitsUniversalDir 'Windows.Foundation.UniversalApiContract.winmd') -Force
              $kitsNeutral = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1\References\CommonConfiguration\Neutral'
              Copy-Item $isoUniversal.FullName (Join-Path $kitsNeutral 'Windows.Foundation.UniversalApiContract.winmd') -Force
              Write-Host "Using Universal API contract from WP8.1 SDK media: $($isoUniversal.FullName)"
            } else { Write-Host 'WP8.1 SDK media did not contain UniversalApiContract.winmd; retaining NuGet fallback.' }
          } finally {
            Dismount-DiskImage -ImagePath $iso -ErrorAction SilentlyContinue
          }

      - name: Configure Windows Phone SDK path
        shell: powershell
        run: |
          $legacyPhoneRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Phone Kits\8.1'
          if (-not (Test-Path (Join-Path $legacyPhoneRoot 'References'))) { throw "WP8.1 SDK root not found: $legacyPhoneRoot" }

          $legacyReferences = Join-Path $legacyPhoneRoot 'References\CommonConfiguration\Neutral'
          New-Item -ItemType Directory -Force -Path $legacyReferences | Out-Null
          Copy-Item (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1\References\CommonConfiguration\Neutral\Windows.winmd') (Join-Path $legacyReferences 'Windows.winmd') -Force
          $phoneUniversalDir = Join-Path $legacyPhoneRoot 'References\Windows.Foundation.UniversalApiContract'
          New-Item -ItemType Directory -Force -Path $phoneUniversalDir | Out-Null
          $universalSource = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1\References\Windows.Foundation.UniversalApiContract\Windows.Foundation.UniversalApiContract.winmd'
          if (-not (Test-Path $universalSource)) { throw "Universal contract source not found: $universalSource" }
          Copy-Item $universalSource (Join-Path $phoneUniversalDir 'Windows.Foundation.UniversalApiContract.winmd') -Force
          Copy-Item $universalSource (Join-Path $legacyReferences 'Windows.Foundation.UniversalApiContract.winmd') -Force

          $registryPaths = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\WindowsPhone\v8.1',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\WindowsPhoneApp\v8.1'
          )
          foreach ($key in $registryPaths) {
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name 'Install Path' -PropertyType String -Value ($legacyPhoneRoot + '\') -Force | Out-Null
            New-ItemProperty -Path $key -Name 'InstallationFolder' -PropertyType String -Value ($legacyPhoneRoot + '\') -Force | Out-Null
          }

          "WINDOWS_PHONE_SDK_DIR=$legacyPhoneRoot" | Out-File $env:GITHUB_ENV -Append
          "TARGET_PLATFORM_SDK_ROOT_OVERRIDE=$legacyPhoneRoot" | Out-File $env:GITHUB_ENV -Append
          "WINDOWS_SDK_ROOT=$(Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\8.1')" | Out-File $env:GITHUB_ENV -Append

      - name: Locate WP XAML build tools
        shell: powershell
        run: |
          $msbuild = "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          $target = "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WindowsXaml\v17.0\8.1\Microsoft.Windows.UI.Xaml.CSharp.Targets"
          if (-not (Test-Path $msbuild) -or -not (Test-Path $target)) { throw "WP8.1 XAML MSBuild tools not found." }
          "MSBUILD_PATH=$msbuild" | Out-File $env:GITHUB_ENV -Append

      - name: Install .NET Framework 4.0 reference assemblies
        shell: powershell
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
          $packages = Join-Path $env:RUNNER_TEMP "nuget-packages"
          New-Item -ItemType Directory -Force -Path $packages | Out-Null
          & $nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory $packages -NonInteractive
          $frameworkRoot = Join-Path $packages "Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework\v4.0"
          if (-not (Test-Path (Join-Path $frameworkRoot "mscorlib.dll"))) { throw "NET Framework 4.0 reference assemblies not found." }
          "FRAMEWORK_PATH=$frameworkRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Diagnose XAML metadata resolution
        shell: powershell
        run: |
          Write-Host "=== UniversalApiContract files ==="
          Get-ChildItem "C:\Program Files (x86)" -Recurse -Filter "Windows.Foundation.UniversalApiContract.winmd" -File -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          Write-Host "=== XAML target around CompileXaml ==="
          $target = "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\WindowsXaml\v17.0\8.1\Microsoft.Windows.UI.Xaml.Common.targets"
          if (Test-Path $target) { Get-Content $target | Select-Object -Skip 215 -First 55 }
          Write-Host "=== SDK registry ==="
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\WindowsPhone\v8.1' -ErrorAction SilentlyContinue | Format-List *
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\WindowsPhoneApp\v8.1' -ErrorAction SilentlyContinue | Format-List *

      - name: Build solution
        shell: powershell
        run: |
          & "$env:MSBUILD_PATH" ".\ESP32-AI-Control-WP81.sln" /m /t:Build /p:Configuration=Debug /p:Platform="ARM" /p:FrameworkPathOverride="$env:FRAMEWORK_PATH" /p:WindowsPhoneSdkDir="$env:WINDOWS_PHONE_SDK_DIR" /p:WindowsPhoneSDKDir="$env:WINDOWS_PHONE_SDK_DIR" /p:WindowsPhoneSdkRoot="$env:WINDOWS_PHONE_SDK_DIR" /p:WindowsPhoneSDKRoot="$env:WINDOWS_PHONE_SDK_DIR" /p:TargetPlatformSdkRootOverride="$env:TARGET_PLATFORM_SDK_ROOT_OVERRIDE" /p:TargetPlatformSdkRoot="$env:TARGET_PLATFORM_SDK_ROOT_OVERRIDE" /p:WindowsSdkDir="$env:WINDOWS_SDK_ROOT" /p:WindowsPhoneSdkVersion="8.1" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WP81-build-output
          path: |
            src/ESP32AIControl.WP81/bin/**
            src/ESP32AIControl.WP81/obj/**
          if-no-files-found: warn
