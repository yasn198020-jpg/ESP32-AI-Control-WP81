name: WP8.1 build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate WP XAML build tools
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles(x86)\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles(x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2019\Professional\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles(x86)\Microsoft Visual Studio\2019\Professional\MSBuild\Current\Bin\MSBuild.exe"
          )

          $selected = $null
          $selectedTarget = $null

          foreach ($msbuild in $candidates) {
            if (-not (Test-Path $msbuild)) {
              continue
            }

            $msbuildRoot = Split-Path (Split-Path (Split-Path $msbuild -Parent) -Parent) -Parent
            $targetCandidates = @(
              (Join-Path $msbuildRoot "Microsoft\WindowsXaml\v17.0\8.1\Microsoft.Windows.UI.Xaml.CSharp.Targets"),
              (Join-Path $msbuildRoot "Microsoft\WindowsXaml\v16.0\8.1\Microsoft.Windows.UI.Xaml.CSharp.Targets"),
              (Join-Path $msbuildRoot "Microsoft\VisualStudio\v17.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets"),
              (Join-Path $msbuildRoot "Microsoft\VisualStudio\v16.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets")
            )

            Write-Host "Checking MSBuild: $msbuild"
            foreach ($target in $targetCandidates) {
              Write-Host "  Target: $target"
              if (Test-Path $target) {
                $selected = $msbuild
                $selectedTarget = $target
                break
              }
            }

            if ($selected) {
              break
            }
          }

          if (-not $selected) {
            Write-Host "WindowsXaml targets found:"
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio","C:\Program Files (x86)\Microsoft Visual Studio","C:\Program Files (x86)\MSBuild" -Filter Microsoft.Windows.UI.Xaml.CSharp.Targets -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "No installed MSBuild with WP8.1 Windows XAML targets was found."
          }

          Write-Host "Selected MSBuild: $selected"
          Write-Host "Selected target: $selectedTarget"
          "MSBUILD_PATH=$selected" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MSBUILD_TARGET=$selectedTarget" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $selected -version

      - name: Locate solution
        shell: powershell
        run: |
          if (-not (Test-Path ".\ESP32-AI-Control-WP81.sln")) {
            throw "Solution ESP32-AI-Control-WP81.sln not found."
          }
          Get-ChildItem -Recurse -Filter *.csproj | Select-Object FullName

      - name: Build solution
        shell: powershell
        run: |
          & "$env:MSBUILD_PATH" ".\ESP32-AI-Control-WP81.sln" /m /t:Build /p:Configuration=Debug /p:Platform="ARM" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WP81-build-output
          path: |
            src/ESP32AIControl.WP81/bin/**
            src/ESP32AIControl.WP81/obj/**
          if-no-files-found: warn
