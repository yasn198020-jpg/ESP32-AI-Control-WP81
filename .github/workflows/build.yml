name: WP8.1 build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: wp81-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Windows metadata for legacy XAML compiler
        shell: powershell
        run: |
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits"
          $winmd = Get-ChildItem $kitsRoot -Recurse -Filter "Windows.winmd" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\References\\CommonConfiguration\\Neutral\\Windows.winmd$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $winmd) {
            Write-Host "No Windows.winmd found in installed Windows Kits; obtaining metadata from Microsoft Windows SDK reference package."
            $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
            $metadataPackageRoot = Join-Path $env:RUNNER_TEMP "windows-sdk-metadata"
            New-Item -ItemType Directory -Force -Path $metadataPackageRoot | Out-Null
            & $nuget install Microsoft.Windows.SDK.Contracts -Version 10.0.26100.4654 -OutputDirectory $metadataPackageRoot -NonInteractive

            $winmd = Get-ChildItem $metadataPackageRoot -Recurse -Filter "Windows.winmd" -File -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $winmd) {
              Write-Host "Windows SDK package contents:"
              Get-ChildItem $metadataPackageRoot -Recurse | Select-Object -First 200 FullName
              throw "Windows.winmd was not found in the Microsoft.Windows.SDK.Contracts package."
            }
          }

          $legacyRoot = Join-Path $kitsRoot "8.1"
          $legacyMetadata = Join-Path $legacyRoot "References\CommonConfiguration\Neutral"
          New-Item -ItemType Directory -Force -Path $legacyMetadata | Out-Null
          Copy-Item $winmd.FullName (Join-Path $legacyMetadata "Windows.winmd") -Force

          Write-Host "Using Windows metadata: $($winmd.FullName)"
          Write-Host "Prepared legacy metadata path: $(Join-Path $legacyMetadata 'Windows.winmd')"

      - name: Install Windows Phone 8.1 SDK components
        shell: powershell
        timeout-minutes: 45
        run: |
          $iso = Join-Path $env:RUNNER_TEMP "windowsphone81sdkupdate1.iso"
          $url = "https://download.microsoft.com/download/E/7/D/E7D9744A-06A6-46FB-AEA4-50FAAEC6CE73/windowsphone81sdkupdate1.iso"

          Write-Host "Downloading official Windows Phone 8.1 Update 1 ISO with BITS..."
          Start-BitsTransfer -Source $url -Destination $iso -DisplayName "Windows Phone 8.1 SDK ISO" -Description "Microsoft Windows Phone 8.1 Update 1" -Priority High

          if (-not (Test-Path $iso)) {
            throw "Windows Phone SDK ISO was not downloaded."
          }

          $size = (Get-Item $iso).Length
          Write-Host "Downloaded Windows Phone SDK ISO: $size bytes"
          if ($size -lt 800MB) {
            throw "Downloaded Windows Phone SDK ISO is unexpectedly small."
          }

          $image = Mount-DiskImage -ImagePath $iso -PassThru
          try {
            $volume = $image | Get-Volume | Where-Object DriveLetter | Select-Object -First 1
            if (-not $volume) { throw "Could not determine mounted Windows Phone SDK ISO drive." }
            $root = "$($volume.DriveLetter):\\"
            Write-Host "Mounted SDK ISO at $root"

            $msis = Get-ChildItem $root -Recurse -Filter *.msi -File -ErrorAction SilentlyContinue
            Write-Host "MSI packages found: $($msis.Count)"

            $selected = foreach ($msi in $msis) {
              if ($msi.Name -ieq 'mobiletools_wpsdkcore_net.msi' -or
                  $msi.Name -ieq 'phoneaddon_sharedcore.msi' -or
                  $msi.Name -ieq 'typescript_sdk.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-ARM.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-Desktop.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-Desktop-x64.msi' -or
                  $msi.Name -ieq 'WindowsPhoneSdk-x86.msi' -or
                  $msi.Name -like 'Windows Software Development Kit for Windows Store Apps-x86_en-us.msi') {
                $msi
              }
            }

            if (-not $selected) {
              Write-Host "Available MSI packages (first 150):"
              $msis | Select-Object -First 150 -ExpandProperty FullName
              throw "No Windows Phone 8.1 SDK MSI packages were found on the ISO."
            }

            Write-Host "Selected SDK MSI packages:"
            $selected | ForEach-Object { Write-Host $_.FullName }

            foreach ($msi in $selected) {
              $log = Join-Path $env:RUNNER_TEMP ($msi.BaseName + '.log')
              Write-Host "Installing $($msi.Name)"
              $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList '/i', $msi.FullName, '/qn', '/norestart', '/L*v', $log -Wait -PassThru
              Write-Host "Exit code: $($proc.ExitCode)"
              if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
                if (Test-Path $log) { Get-Content $log -Tail 120 }
                throw "Windows Phone SDK MSI installation failed: $($msi.Name)"
              }
            }
          }
          finally {
            Dismount-DiskImage -ImagePath $iso -ErrorAction SilentlyContinue
          }

          $phoneRoots = @(
            'C:\\Program Files (x86)\\Microsoft SDKs\\Windows Phone',
            'C:\\Program Files (x86)\\Microsoft SDKs\\Windows Phone\\v8.1'
          )
          foreach ($path in $phoneRoots) {
            if (Test-Path $path) { Write-Host "Found: $path" }
          }

          $registryHints = @(
            'HKLM:\SOFTWARE\\Microsoft\\Microsoft SDKs\\WindowsPhone',
            'HKLM:\SOFTWARE\\WOW6432Node\\Microsoft\\Microsoft SDKs\\WindowsPhone'
          )
          foreach ($key in $registryHints) {
            if (Test-Path $key) {
              Write-Host "Found SDK registry key: $key"
              Get-ItemProperty $key | Format-List *
            }
          }
      - name: Configure Windows Phone SDK path
        shell: powershell
        run: |
          $roots = @(
            'C:\Program Files (x86)\Microsoft SDKs\Windows Phone\v8.1',
            'C:\Program Files (x86)\Microsoft SDKs\Windows Phone'
          )
          $sdkRoot = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $candidate = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -eq 'v8.1' } | Select-Object -First 1
              if ($candidate) { $sdkRoot = $candidate.FullName; break }
              if (Test-Path (Join-Path $root 'References')) { $sdkRoot = $root; break }
            }
          }
          if (-not $sdkRoot) {
            throw "Installed Windows Phone 8.1 SDK root was not found."
          }
          Write-Host "Windows Phone SDK root: $sdkRoot"
          Write-Host "Windows Phone SDK contents:"
          Get-ChildItem $sdkRoot -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ieq 'Windows.winmd' -or $_.Name -match 'Microsoft.Windows.UI.Xaml' } |
            Select-Object -First 100 FullName
          "WINDOWS_PHONE_SDK_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_PLATFORM_SDK_ROOT_OVERRIDE=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Locate WP XAML build tools
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          )

          $selected = $null
          foreach ($msbuild in $candidates) {
            if (-not (Test-Path $msbuild)) { continue }
            $msbuildRoot = Split-Path (Split-Path (Split-Path $msbuild -Parent) -Parent) -Parent
            $targets = @(
              (Join-Path $msbuildRoot "Microsoft\WindowsXaml\v17.0\8.1\Microsoft.Windows.UI.Xaml.CSharp.Targets"),
              (Join-Path $msbuildRoot "Microsoft\WindowsXaml\v16.0\8.1\Microsoft.Windows.UI.Xaml.CSharp.Targets"),
              (Join-Path $msbuildRoot "Microsoft\VisualStudio\v17.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets"),
              (Join-Path $msbuildRoot "Microsoft\VisualStudio\v16.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets")
            )
            foreach ($target in $targets) {
              if (Test-Path $target) {
                $selected = $msbuild
                Write-Host "Selected MSBuild: $msbuild"
                Write-Host "Selected XAML targets: $target"
                break
              }
            }
            if ($selected) { break }
          }

          if (-not $selected) {
            throw "No installed MSBuild with WP8.1 Windows XAML targets was found."
          }

          "MSBUILD_PATH=$selected" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $selected -version

      - name: Install .NET Framework 4.0 reference assemblies
        shell: powershell
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
          $packages = Join-Path $env:RUNNER_TEMP "nuget-packages"
          New-Item -ItemType Directory -Force -Path $packages | Out-Null

          & $nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory $packages -NonInteractive

          $frameworkRoot = Join-Path $packages "Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework\v4.0"
          if (-not (Test-Path (Join-Path $frameworkRoot "mscorlib.dll"))) {
            Write-Host "Installed reference assemblies:"
            Get-ChildItem $packages -Recurse -Filter mscorlib.dll | Select-Object -ExpandProperty FullName
            throw "NET Framework 4.0 reference assemblies were not installed at the expected location."
          }

          Write-Host "Using .NET Framework 4.0 reference assemblies: $frameworkRoot"
          "FRAMEWORK_PATH=$frameworkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Locate solution
        shell: powershell
        run: |
          if (-not (Test-Path ".\ESP32-AI-Control-WP81.sln")) {
            throw "Solution ESP32-AI-Control-WP81.sln not found."
          }
          Get-ChildItem -Recurse -Filter *.csproj | Select-Object FullName

      - name: Build solution
        shell: powershell
        run: |
          & "$env:MSBUILD_PATH" ".\ESP32-AI-Control-WP81.sln" /m /t:Build /p:Configuration=Debug /p:Platform="ARM" /p:FrameworkPathOverride="$env:FRAMEWORK_PATH" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WP81-build-output
          path: |
            src/ESP32AIControl.WP81/bin/**
            src/ESP32AIControl.WP81/obj/**
          if-no-files-found: warn
