name: WP8.1 build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate WP XAML build tools
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles(x86)\Microsoft Visual Studio\2019\Professional\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2019\Professional\MSBuild\Current\Bin\MSBuild.exe",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          )

          $selected = $null
          foreach ($msbuild in $candidates) {
            if (Test-Path $msbuild) {
              $root = Split-Path (Split-Path (Split-Path $msbuild -Parent) -Parent) -Parent
              $target = Join-Path $root "MSBuild\Microsoft\VisualStudio\v16.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets"
              if ($msbuild -like "*Visual Studio\2019\*") {
                $target = Join-Path $root "MSBuild\Microsoft\VisualStudio\v16.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets"
              } else {
                $target = Join-Path $root "MSBuild\Microsoft\VisualStudio\v17.0\WindowsXaml\Microsoft.Windows.UI.Xaml.CSharp.targets"
              }

              Write-Host "Checking: $msbuild"
              Write-Host "Target:   $target"

              if (Test-Path $target) {
                $selected = $msbuild
                "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
                "MSBUILD_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
                break
              }
            }
          }

          if (-not $selected) {
            Write-Host "Installed MSBuild executables:"
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio","C:\Program Files (x86)\Microsoft Visual Studio" -Filter MSBuild.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            Write-Host "WindowsXaml targets found:"
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio","C:\Program Files (x86)\Microsoft Visual Studio","C:\Program Files (x86)\MSBuild" -Filter Microsoft.Windows.UI.Xaml.CSharp.targets -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "No installed MSBuild with Microsoft.Windows.UI.Xaml.CSharp.targets was found."
          }

          Write-Host "Selected MSBuild: $selected"
          & $selected -version

      - name: Locate solution
        shell: powershell
        run: |
          if (-not (Test-Path ".\ESP32-AI-Control-WP81.sln")) {
            throw "Solution ESP32-AI-Control-WP81.sln not found."
          }
          Get-ChildItem -Recurse -Filter *.csproj | Select-Object FullName

      - name: Build solution
        shell: powershell
        run: |
          & "$env:MSBUILD_PATH" ".\ESP32-AI-Control-WP81.sln" /m /t:Build /p:Configuration=Debug /p:Platform="ARM" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WP81-build-output
          path: |
            src/ESP32AIControl.WP81/bin/**
            src/ESP32AIControl.WP81/obj/**
          if-no-files-found: warn
