name: WP81 Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WP8.1 SDK payload from official VS2015 Update 3 ISO
        shell: powershell
        timeout-minutes: 75
        run: |
          # The VS2015 web bootstrapper does not reliably install the legacy
          # WP8.1 payload on Windows Server 2025. Use the official offline ISO,
          # but download it with preinstalled aria2 using multiple connections.
          # We do NOT install VS2015; only the WP8.1 SDK MSIs are installed.
          $iso = Join-Path $env:RUNNER_TEMP "vs2015.3.com_enu.iso"
          $url = "https://download.microsoft.com/download/b/e/d/bedddfc4-55f4-4748-90a8-ffe38a40e89f/vs2015.3.com_enu.iso"

          Write-Host "aria2 version:"
          & aria2c --version | Select-Object -First 2
          Write-Host "Downloading official VS2015 Update 3 ISO with 16 connections..."
          & aria2c --allow-overwrite=true --file-allocation=none --max-connection-per-server=16 --split=16 --min-split-size=10M --summary-interval=15 --console-log-level=notice --dir="$env:RUNNER_TEMP" --out="vs2015.3.com_enu.iso" "$url"
          if ($LASTEXITCODE -ne 0) { throw "aria2 failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $iso)) { throw "VS2015 Update 3 ISO was not downloaded." }

          $size = (Get-Item $iso).Length
          Write-Host ("Downloaded ISO size: {0:N0} bytes" -f $size)

          Mount-DiskImage -ImagePath $iso -StorageType ISO -Access ReadOnly
          $drive = (Get-DiskImage -ImagePath $iso | Get-Volume).DriveLetter
          if (-not $drive) { throw "Could not determine mounted ISO drive letter." }
          $root = $drive + ":\"
          Write-Host "ISO mounted at $root"

          $msis = Get-ChildItem $root -Filter "WindowsPhoneSdk-*.msi" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @(
              "WindowsPhoneSdk-Desktop.msi",
              "WindowsPhoneSdk-Desktop-x64.msi",
              "WindowsPhoneSdk-x86.msi",
              "WindowsPhoneSdk-ARM.msi"
            ) } |
            Sort-Object FullName -Unique

          Write-Host "=== WP8.1 MSI payloads found on ISO ==="
          $msis | ForEach-Object {
            $mb = [math]::Round($_.Length / 1MB, 2)
            Write-Host ("{0} ({1} MB)" -f $_.FullName, $mb)
          }
          if (-not $msis) {
            throw "Official VS2015 Update 3 ISO does not contain the expected WP8.1 MSI payloads."
          }

          foreach ($msi in $msis) {
            Write-Host "Installing WP8.1 payload: $($msi.Name)"
            $p = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i",$msi.FullName,"/qn","/norestart","REBOOT=ReallySuppress") -Wait -PassThru
            Write-Host "$($msi.Name) exit code: $($p.ExitCode)"
            if ($p.ExitCode -notin @(0,3010)) {
              throw "WP8.1 MSI failed: $($msi.Name), exit code $($p.ExitCode)"
            }
          }

          Dismount-DiskImage -ImagePath $iso
          Remove-Item $iso -Force -ErrorAction SilentlyContinue
          Write-Host "WP8.1 payload installation from ISO completed."

      - name: Install Windows 8.1 SDK
        shell: powershell
        timeout-minutes: 15
        run: |
          $sdkSetup = Join-Path $env:RUNNER_TEMP "sdksetup-81.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=323507" -OutFile $sdkSetup
          $p = Start-Process -FilePath $sdkSetup -ArgumentList @("/quiet","/norestart") -Wait -PassThru
          Write-Host "Windows 8.1 SDK setup exit code: $($p.ExitCode)"
          if ($p.ExitCode -notin @(0,3010)) {
            throw "Windows 8.1 SDK setup failed with exit code $($p.ExitCode)"
          }

      - name: Check WP8.1 SDK availability
        shell: powershell
        run: |
          Write-Host "=== WP8.1 SDK availability ==="
          Write-Host "Previous direct fwlink package URLs returned HTTP 404; do not download them."
          @(
            "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows Phone",
            "${env:ProgramFiles(x86)}\Microsoft SDKs\WindowsPhoneApp",
            "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v8.1",
            "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v8.1A"
          ) | ForEach-Object {
            if (Test-Path $_) { Write-Host "FOUND: $_" } else { Write-Host "MISSING: $_" }
          }

      - name: Inspect local toolchain
        shell: powershell
        run: |
          Write-Host "=== OS ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          Write-Host "=== Visual Studio ==="
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -format json
          Write-Host "=== MSBuild candidates ==="
          Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio","${env:ProgramFiles(x86)}\Microsoft Visual Studio","${env:ProgramFiles(x86)}\MSBuild" -Filter MSBuild.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== SDKs ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows" -Directory -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== Windows Phone / WP8.1 ==="
          @("${env:ProgramFiles(x86)}\Microsoft SDKs\Windows Phone","${env:ProgramFiles(x86)}\Microsoft SDKs\WindowsPhoneApp","${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v8.1","${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v8.1A") | ForEach-Object {
            if (Test-Path $_) { Write-Host "FOUND: $_"; Get-ChildItem $_ -Directory -ErrorAction SilentlyContinue | Select-Object FullName }
            else { Write-Host "MISSING: $_" }
          }
          Write-Host "=== XAML targets ==="
          Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio","${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Filter Microsoft.Windows.UI.Xaml.CSharp.Targets -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Select latest MSBuild
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio with MSBuild was not found." }
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            $msbuild = Get-ChildItem $vs -Filter MSBuild.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $msbuild) { throw "MSBuild executable was not found under $vs" }
          Write-Host "Using Visual Studio: $vs"
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild -version -nologo
          "MSBUILD_EXE=$msbuild" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Prepare .NET 4.5 reference assemblies
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".ci\reference-assemblies"
          $nupkg = Join-Path $env:RUNNER_TEMP "net45-ref.nupkg"
          $zip = Join-Path $env:RUNNER_TEMP "net45-ref.zip"
          $extract = Join-Path $env:RUNNER_TEMP "net45-ref"

          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net45/1.0.3" -OutFile $nupkg
          Copy-Item $nupkg $zip -Force
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $source = Join-Path $extract "build\.NETFramework\v4.5"
          $target = Join-Path $root ".NETCore\v4.5"

          if (-not (Test-Path (Join-Path $source "mscorlib.dll"))) {
            throw "The .NET 4.5 reference assembly package was not extracted as expected: $source"
          }

          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $source "*") $target -Recurse -Force
          # XAML compiler resolves facade assemblies (System.Runtime, etc.)
          # from the framework root, not only from the package's Facades folder.
          $facades = Join-Path $extract "build\.NETFramework\v4.5\Facades"
          if (Test-Path $facades) {
            Copy-Item (Join-Path $facades "*.dll") $target -Force -ErrorAction Stop
            Write-Host "Copied .NET facade assemblies into framework root."
          } else {
            Write-Host "No Facades directory found in reference package."
          }

          # MSBuild resolves TargetFrameworkIdentifier=.NETCore through framework-list metadata.
          $redist = Join-Path $target "RedistList"
          New-Item -ItemType Directory -Force -Path $redist | Out-Null
          Set-Content -Path (Join-Path $redist "FrameworkList.xml") -Value '<FileList Redist="Net45" Name=".NETCore,Version=v4.5"></FileList>' -Encoding UTF8

          Write-Host "Using .NET 4.5 reference assemblies: $target"
          Write-Host "FrameworkList: $(Join-Path $redist "FrameworkList.xml")"
          Get-ChildItem $target | Select-Object Name
          "TARGET_FRAMEWORK_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8
          "FRAMEWORK_PATH_OVERRIDE=$target" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Build WP81 Debug ARM
        shell: powershell
        run: |
          & "$env:MSBUILD_EXE" "$env:GITHUB_WORKSPACE\ESP32-AI-Control-WP81.sln" /m /nologo /verbosity:minimal /p:Configuration=Debug /p:Platform=ARM /p:AppxPackageSigningEnabled=False /p:RestorePackages=false /p:TargetFrameworkRootPath="$env:TARGET_FRAMEWORK_ROOT" /p:FrameworkPathOverride="$env:FRAMEWORK_PATH_OVERRIDE" /p:_TargetFrameworkDirectories="$env:FRAMEWORK_PATH_OVERRIDE" /p:_FullFrameworkReferenceAssemblyPaths="$env:FRAMEWORK_PATH_OVERRIDE"

      - name: Upload MSBuild binary log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wp81-build-diagnostics
          path: |
            **/*.binlog
            **/msbuild*.log
          if-no-files-found: ignore
