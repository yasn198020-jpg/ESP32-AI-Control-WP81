name: WP81 Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect local toolchain
        shell: powershell
        run: |
          Write-Host "=== OS ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          Write-Host "=== Visual Studio ==="
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -format json
          Write-Host "=== MSBuild candidates ==="
          Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio","${env:ProgramFiles(x86)}\Microsoft Visual Studio","${env:ProgramFiles(x86)}\MSBuild" -Filter MSBuild.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== SDKs ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows" -Directory -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== Windows Phone / WP8.1 ==="
          @("${env:ProgramFiles(x86)}\Microsoft SDKs\Windows Phone","${env:ProgramFiles(x86)}\Microsoft SDKs\WindowsPhoneApp","${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v8.1","${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v8.1A") | ForEach-Object {
            if (Test-Path $_) { Write-Host "FOUND: $_"; Get-ChildItem $_ -Directory -ErrorAction SilentlyContinue | Select-Object FullName }
            else { Write-Host "MISSING: $_" }
          }
          Write-Host "=== XAML targets ==="
          Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio","${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Filter Microsoft.Windows.UI.Xaml.CSharp.Targets -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Select latest MSBuild
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio with MSBuild was not found." }
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            $msbuild = Get-ChildItem $vs -Filter MSBuild.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $msbuild) { throw "MSBuild executable was not found under $vs" }
          Write-Host "Using Visual Studio: $vs"
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild -version -nologo
          "MSBUILD_EXE=$msbuild" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Install Windows 8.1 SDK
        shell: powershell
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "windows-sdk-8.1.exe"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/B/0/C/B0C80BA3-8AD6-4958-810B-6882485230B5/standalonesdk/sdksetup.exe" -OutFile $sdk
          & $sdk /Quiet /NoRestart /Log "$env:RUNNER_TEMP\windows-sdk-8.1.log"
          if ($LASTEXITCODE -notin @(0,3010)) {
            Get-Content "$env:RUNNER_TEMP\windows-sdk-8.1.log" -Tail 200 -ErrorAction SilentlyContinue
            throw "Windows 8.1 SDK installation failed with exit code $LASTEXITCODE"
          }

      - name: Install WP8.1 SDK payload
        shell: powershell
        run: |
          $iso = Join-Path $env:RUNNER_TEMP "vs2013.5.iso"
          $pkg = Join-Path $env:RUNNER_TEMP "wp81sdk"
          $url = "https://download.microsoft.com/download/A/A/D/AAD1AA11-FF9A-4B3C-8601-054E89260B78/vs2013.5_ce_enu.iso"

          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $iso

          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          }
          if (-not $sevenZip) { throw "7-Zip was not found on the GitHub runner." }

          & $sevenZip x $iso "packages\WindowsPhone81SDK\*" -o"$pkg" -y
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract Windows Phone 8.1 SDK payload from VS2013 Update 5 ISO." }

          $wp = Join-Path $pkg "packages\WindowsPhone81SDK"
          Get-ChildItem $wp | Select-Object Name,Length

          $msis = @(
            "WindowsPhoneSdk-Desktop.msi",
            "WindowsPhoneSdk-Desktop-x64.msi",
            "WindowsPhoneSdk-ARM.msi"
          )

          foreach ($name in $msis) {
            $msi = Join-Path $wp $name
            if (-not (Test-Path $msi)) { throw "Missing WP8.1 SDK package: $name" }
            Write-Host "Installing $name"
            $p = Start-Process msiexec.exe -Wait -PassThru -NoNewWindow -ArgumentList "/i `"$msi`" /qn /norestart"
            if ($p.ExitCode -notin @(0,3010)) { throw "$name installation failed with exit code $($p.ExitCode)" }
          }

          Write-Host "=== WP8.1 SDK files ==="
          Get-ChildItem "$env:ProgramFiles(x86)\Windows Phone Kits\8.1" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 80 FullName

          Write-Host "=== XAML targets after SDK install ==="
          Get-ChildItem "$env:ProgramFiles(x86)\MSBuild" -Recurse -Filter "Microsoft.Windows.UI.Xaml.CSharp.targets" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Prepare .NET 4.5 reference assemblies
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE ".ci\reference-assemblies"
          $nupkg = Join-Path $env:RUNNER_TEMP "net45-ref.nupkg"
          $zip = Join-Path $env:RUNNER_TEMP "net45-ref.zip"
          $extract = Join-Path $env:RUNNER_TEMP "net45-ref"

          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net45/1.0.3" -OutFile $nupkg
          Copy-Item $nupkg $zip -Force
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $source = Join-Path $extract "build\.NETFramework\v4.5"
          $target = Join-Path $root ".NETCore\v4.5"

          if (-not (Test-Path (Join-Path $source "mscorlib.dll"))) {
            throw "The .NET 4.5 reference assembly package was not extracted as expected: $source"
          }

          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $source "*") $target -Recurse -Force
          $redist = Join-Path $target "RedistList"
          New-Item -ItemType Directory -Force -Path $redist | Out-Null
          @'
<List Name=".NETCore,Version=v4.5" />
'@ | Set-Content (Join-Path $redist "FrameworkList.xml") -Encoding UTF8
          Write-Host "Using .NET 4.5 reference assemblies: $target"
          Get-ChildItem $target | Select-Object Name
          "TARGET_FRAMEWORK_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8
          "FRAMEWORK_PATH_OVERRIDE=$target" | Out-File $env:GITHUB_ENV -Encoding utf8

      - name: Build WP81 Debug ARM
        shell: powershell
        run: |
          & "$env:MSBUILD_EXE" "$env:GITHUB_WORKSPACE\ESP32-AI-Control-WP81.sln" /m /nologo /verbosity:minimal /p:Configuration=Debug /p:Platform=ARM /p:VisualStudioVersion=12.0 /p:AppxPackageSigningEnabled=False /p:RestorePackages=false /p:TargetFrameworkRootPath="$env:TARGET_FRAMEWORK_ROOT" /p:FrameworkPathOverride="$env:FRAMEWORK_PATH_OVERRIDE"

      - name: Upload MSBuild binary log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wp81-build-diagnostics
          path: |
            **/*.binlog
            **/msbuild*.log
          if-no-files-found: ignore
